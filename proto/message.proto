syntax = "proto3";

package social;
option go_package = "api-thinktalk/client/message/pb;pb";

service Message {
  rpc NotificationList(NotificationListRequest) returns (NotificationListResponse);
  rpc UnreadCount(UnreadCountRequest) returns (UnreadCountResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
}

message DeleteNotificationRequest {
  int64 userId = 1;
  int64 notificationId = 2;
}

message DeleteNotificationResponse {
  int64 code = 1;
  string msg = 2;
}

message NotificationListRequest {
  int64 userId = 1;
  int64 cursor = 2;
  int64 pageSize = 3;
  int32 type = 4;
}

message NotificationItem {
  int64 id = 1;
  int32 type = 2;
  string title = 3;
  string content = 4;
  int64 refId = 5;
  string bizId = 6;
  int64 triggerUserId = 7;
  bool isRead = 8;
  int64 createTime = 9;
}

message NotificationListData {
  repeated NotificationItem items = 1;
  int64 cursor = 2;
  bool isEnd = 3;
}

message NotificationListResponse {
  int64 code = 1;
  string msg = 2;
  NotificationListData data = 3;
}

message UnreadCountRequest {
  int64 userId = 1;
}

message UnreadCountData {
  int64 total = 1;
  map<int32, int64> typeCounts = 2;
}

message UnreadCountResponse {
  int64 code = 1;
  string msg = 2;
  UnreadCountData data = 3;
}

message MarkReadRequest {
  int64 userId = 1;
  int64 notificationId = 2;
}

message MarkReadResponse {
  int64 code = 1;
  string msg = 2;
}

message MarkAllReadRequest {
  int64 userId = 1;
  int32 type = 2;
}

message MarkAllReadResponse {
  int64 code = 1;
  string msg = 2;
}
