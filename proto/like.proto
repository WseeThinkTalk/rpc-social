syntax = "proto3";

package social;
option go_package = "api-thinktalk/client/like/service;service";

service Like {
  rpc Thumbup(ThumbupRequest) returns (ThumbupResponse);
  rpc IsThumbup(IsThumbupRequest) returns (IsThumbupResponse);
}

message ThumbupRequest {
  string bizId = 1;
  int64 objId = 2;
  int64 userId = 3;
  int32 likeType = 4;
}

message ThumbupData {
  string bizId = 1;
  int64 objId = 2;
  int64 likeNum = 3;
  int64 dislikeNum = 4;
}

message ThumbupResponse {
  int64 code = 1;
  string msg = 2;
  ThumbupData data = 3;
}

message IsThumbupRequest {
  string bizId = 1;
  int64 targetId = 2;
  int64 userId = 3;
}

message UserThumbup {
  int64 userId = 1;
  int64 thumbupTime = 2;
  int32 likeType = 3;
}

message IsThumbupData {
  map<int64, UserThumbup> userThumbups = 1;
}

message IsThumbupResponse {
  int64 code = 1;
  string msg = 2;
  IsThumbupData data = 3;
}