syntax = "proto3";

package social;
option go_package = "api-thinktalk/client/chat/pb;pb";

service Chat {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc Conversations(ConversationsRequest) returns (ConversationsResponse);
  rpc Messages(MessagesRequest) returns (MessagesResponse);
  rpc MarkRead(ChatMarkReadRequest) returns (ChatMarkReadResponse);
  rpc UnreadCount(ChatUnreadCountRequest) returns (ChatUnreadCountResponse);
}

message SendMessageRequest {
  int64 senderId = 1;
  int64 receiverId = 2;
  string content = 3;
  int32 msgType = 4;
}

message SendMessageData {
  int64 messageId = 1;
}

message SendMessageResponse {
  int64 code = 1;
  string msg = 2;
  SendMessageData data = 3;
}

message ConversationsRequest {
  int64 userId = 1;
  int64 cursor = 2;
  int64 pageSize = 3;
}

message ConversationItem {
  int64 id = 1;
  int64 targetUserId = 2;
  string lastMessage = 3;
  int64 lastMessageTime = 4;
  int64 unreadCount = 5;
}

message ConversationsData {
  repeated ConversationItem items = 1;
  int64 cursor = 2;
  bool isEnd = 3;
}

message ConversationsResponse {
  int64 code = 1;
  string msg = 2;
  ConversationsData data = 3;
}

message MessagesRequest {
  int64 conversationId = 1;
  int64 cursor = 2;
  int64 pageSize = 3;
}

message MessageItem {
  int64 id = 1;
  int64 conversationId = 2;
  int64 senderId = 3;
  int64 receiverId = 4;
  string content = 5;
  int32 msgType = 6;
  bool isRead = 7;
  int64 createTime = 8;
}

message MessagesData {
  repeated MessageItem items = 1;
  int64 cursor = 2;
  bool isEnd = 3;
}

message MessagesResponse {
  int64 code = 1;
  string msg = 2;
  MessagesData data = 3;
}

message ChatMarkReadRequest {
  int64 userId = 1;
  int64 conversationId = 2;
}

message ChatMarkReadResponse {
  int64 code = 1;
  string msg = 2;
}

message ChatUnreadCountRequest {
  int64 userId = 1;
}

message ChatUnreadCountData {
  int64 total = 1;
}

message ChatUnreadCountResponse {
  int64 code = 1;
  string msg = 2;
  ChatUnreadCountData data = 3;
}
